services:
  - type: web
    name: streamsync
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: gunicorn streamfolio.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "streamsync.onrender.com,www.streamfolio.site"
      - key: DATABASE_URL
        fromDatabase:
          name: streamsync-db
          property: connectionString
      - key: WATCHMODE_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://www.streamfolio.site"

databases:
  - name: streamsync-db
    plan: free
